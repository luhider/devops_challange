services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c2admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-surveillance_c2}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-c2admin} -d ${POSTGRES_DB:-surveillance_c2}"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - sensor_backplane

  inference_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: eoir-stack:1.4.2
    command: ["python", "inference_worker/worker.py"]
    environment:
      ENGINE_PATH: /app/models/eo_detector_fp16.engine
      MANIFEST_PATH: /app/models/manifest.json
      WORKER_PORT: "9000"
      TRT_CACHE_DIR: /tmp/trt_cache
      ENGINE_WARMUP_SEC: "1.0"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/status', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 3s
    networks:
      - sensor_backplane

  vision_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: eoir-stack:1.4.2
    command: ["python", "vision_api/app.py"]
    environment:
      APP_PORT: "8000"
      WORKER_URL: "http://inference_worker:9000"
      DB_HOST: "postgres"
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "8000:8000"
    depends_on:
      inference_worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 4s
    networks:
      - edge_dmz
      - sensor_backplane

networks:
  edge_dmz:
    driver: bridge
  sensor_backplane:
    driver: bridge
    internal: true
