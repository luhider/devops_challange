name: Site-Release-CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests || true

  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t registry.site.local/eoir-stack:latest .
      - name: Promote to defence site baseline
        run: |
          echo "Tagging registry.site.local/eoir-stack:latest as site-approved"
